[package]
name = "nightshade-configd"
description = "The Nightshade configuration daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nightshade-configd"
path = "src/main.rs"

[dependencies]
nightshade-common = { workspace = true }
nightshade-proto = { workspace = true }
nightshade-ifprobe = { workspace = true }
nightshade-ifstate = { workspace = true }
nightshade-render = { workspace = true }
nightshade-schema = { workspace = true }

# Only what is used. `process` in particular is absent: configd runs as root,
# and the day it needs to spawn something should be a deliberate edit here
# rather than a capability that was already lying around.
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "net",
    "macros",
    "signal",
    "time",
    "sync",
    "io-util",
] }

nix = { workspace = true, features = ["user", "fs"] }
serde = { workspace = true }
flate2 = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# For forging requests the typed `Request` cannot express, which is the whole
# point of the protocol tests.
nightshade-ifstate = { workspace = true }
nightshade-render = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
