# Physical ports. Everything else is built on top of these, so they are
# applied first.

nodes:
  interfaces:
    children:

      ethernet:
        kind: tag
        help: "Ethernet interface"
        priority: 200
        tag:
          type: interface-name
          help: "Interface name (eth0, eth1, ...)"
        include: [interface-common]
        children:

          hw-id:
            kind: leaf
            type: mac-address
            help: "Permanent MAC of the port this name is pinned to"

          speed:
            kind: leaf
            type: enum
            values: [auto, 10, 100, 1000, 2500, 10000, 25000, 40000, 100000]
            default: auto
            help: "Link speed in Mbit/s, or auto to negotiate"

          duplex:
            kind: leaf
            type: enum
            values: [auto, half, full]
            default: auto
            help: "Duplex mode, or auto to negotiate"
