# System-wide settings.
#
# Applied first (priority 100). A host name change is what the CLI prompt
# reads, and the resolver has to be in place before anything that wants to
# resolve a name.

nodes:
  system:
    kind: container
    help: "System parameters"
    priority: 100
    children:

      host-name:
        kind: leaf
        type: hostname
        default: nightshade
        help: "System host name"

      domain-name:
        kind: leaf
        type: hostname
        help: "DNS domain this system belongs to, e.g. example.com"

      name-server:
        kind: multi-leaf
        type: ip-address
        help: "Domain name server address"

      # What `show interfaces capabilities` prints as the model of the port.
      #
      # Read from DMI when this is not set, which is right on an appliance
      # whose board says what it is. It is configurable because a whitebox
      # rarely does -- a board that reports `To be filled by O.E.M.` is a
      # board an operator has to name themselves.
      platform-model:
        kind: leaf
        type: string
        help: "Hardware model this system reports; read from DMI when unset"

      time-zone:
        kind: leaf
        type: time-zone
        default: UTC
        help: "Time zone, as an Area/Location name"

      login:
        kind: container
        help: "Accounts that can log in to this system"
        children:

          user:
            kind: tag
            help: "A local user account"
            tag:
              type: user-name
              help: "Account name"
            children:

              full-name:
                kind: leaf
                type: string
                help: "Name shown in the account's GECOS field"

              authentication:
                kind: container
                help: "How the account proves who it is"
                children:

                  encrypted-password:
                    kind: leaf
                    type: encrypted-password
                    secret: true
                    help: "crypt(3) hash of the password, never the password"
