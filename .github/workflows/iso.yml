name: iso

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A queued second run would fight the first for the same cache key.
concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coverage-guided fuzzing of the two things that consume operator input: the
  # config file parser and the value validators. Its own job, on the runner
  # rather than in the trixie container, because libFuzzer needs a nightly
  # toolchain and sanitizer support that have no business in the image build.
  #
  # Deliberately brief. This is a regression gate that runs on every push, not
  # a fuzzing campaign; a real campaign runs for hours somewhere else and seeds
  # its findings back here as corpus entries.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      # cargo-fuzz takes a couple of minutes to build from source, and it does
      # not change between runs. The key is the version so an upgrade rebuilds
      # it and nothing else does.
      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-v1

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked

      # `-runs` rather than `-max_total_time`: a run count is reproducible, so
      # a failure here can be reproduced locally with the same number, and a
      # slow runner produces a slower job rather than a weaker test.
      - name: Fuzz
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in curly_parse curly_roundtrip path_parse value_check; do
            echo "::group::$target"
            cargo fuzz run "$target" -- -runs=20000 -max_len=512
            echo "::endgroup::"
          done

      # A crash leaves the input that caused it behind. Without this it is a
      # red X and a log, and reproducing it means guessing.
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest

    # The ISO is built inside the same Debian release it targets. That is not
    # just tidiness: the installer binary is compiled here and has to run inside
    # the image, so it must link against trixie's glibc and not the runner's
    # newer one. mkimage.sh enforces this with a gate that executes the binary
    # inside the chroot, and that gate is what fails if this is ever built
    # somewhere else.
    container:
      image: debian:trixie
      # debootstrap creates device nodes with mknod, and the build bind-mounts
      # /proc, /sys and /dev into the chroot. Neither works in a default
      # container. --privileged is the coarse-but-reliable way to get both on a
      # hosted runner; a finer-grained equivalent is
      #   --cap-add=SYS_ADMIN --cap-add=MKNOD --security-opt apparmor=unconfined
      # which also works but is more likely to break as runner images change.
      #
      # Note there is no loop-device requirement: the ESP image is built with
      # mtools and the squashfs with mksquashfs, both of which work on plain
      # files.
      options: --privileged

    env:
      APT_CACHE: /tmp/nightshade-apt-cache
      # Cargo on the default work directory is fine; the ISO work tree must be
      # on a real filesystem, which it is inside the container.
      WORKDIR: /tmp/nightshade-build

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates \
            debootstrap \
            xorriso \
            squashfs-tools \
            zstd \
            make \
            git \
            curl \
            gcc \
            libc6-dev
          # actions/checkout wants git to trust the workspace it mounts.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' <VERSION)"
          [ -n "$version" ] || { echo "::error::VERSION is empty"; exit 1; }

          # Both the ISO's internal timestamps and the date in its filename come
          # from the commit, so rebuilding a commit reproduces the same name and
          # the same bytes.
          epoch="$(git log -1 --pretty=%ct)"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME disagrees with VERSION ($version)." \
                   "Update VERSION before tagging."
              exit 1
            fi
            iso="nightshade-${version}"
            retention=90
          else
            # YYYYMMDDHHMM in UTC, from the commit date rather than the wall
            # clock so a rebuild of the same commit reproduces the name.
            iso="nightshade-${version}-$(date -u -d "@$epoch" +%Y%m%d%H%M)"
            retention=14
          fi

          # The installer reports its own version from Cargo. A mismatch is not
          # worth failing a build over, but it is worth saying out loud.
          cargo_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$cargo_version" != "$version" ]; then
            echo "::warning::VERSION is $version but Cargo.toml says $cargo_version;" \
                 "nightshade-installer --version will disagree with the ISO."
          fi

          {
            echo "version=$version"
            echo "iso=$iso"
            echo "epoch=$epoch"
            echo "retention=$retention"
          } >>"$GITHUB_OUTPUT"
          echo "Building $iso.iso"

      - name: Cache Debian packages
        uses: actions/cache@v6
        with:
          path: ${{ env.APT_CACHE }}
          # The manifests decide what gets downloaded, so they decide the key.
          key: nightshade-apt-${{ hashFiles('build/mkimage/packages*.list') }}
          restore-keys: |
            nightshade-apt-

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: nightshade-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            nightshade-cargo-

      # The whole workspace, in the dev profile. The release profile exists to
      # make the shipped binaries small; tests do not care, and LTO across
      # every crate on each push is minutes of runner time for nothing.
      - name: Test the workspace
        run: cargo test --workspace --locked

      # Three binaries: the installer, which runs in the live session, and
      # configd and ns, which run on the installed box. All built here so all
      # three link against trixie's glibc rather than the runner's.
      - name: Build the binaries that go into the image
        run: cargo build --release --locked -p nightshade-installer -p nightshade-configd -p nightshade-cli

      - name: Build the ISO
        env:
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        run: |
          set -euo pipefail
          mkdir -p "$APT_CACHE" dist
          # Guard, not the fix: git records the executable bit, but a commit
          # made from a Windows checkout (core.fileMode=false) stores 100644 and
          # the runner then fails with a bare "Permission denied" / exit 126.
          # The bit belongs in the repo -- `git update-index --chmod=+x` -- and
          # this line just stops a lost one from costing a CI round trip.
          chmod +x build/mkimage/mkimage.sh
          build/mkimage/mkimage.sh \
            -o "dist/${{ steps.version.outputs.iso }}.iso" \
            -v "${{ steps.version.outputs.version }}" \
            -w "$WORKDIR" \
            -c "$APT_CACHE" \
            -b target/release/nightshade-installer \
            -B target/release

      - name: Summarise
        run: |
          set -euo pipefail
          {
            echo "### Nightshade ${{ steps.version.outputs.version }}"
            echo
            echo '```'
            ls -lh dist/
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded on every run, not just tags: a build you cannot download is
      # only half a CI. Tags keep theirs for 90 days, branch builds for 14,
      # because an untagged ISO is ~285MB of throwaway.
      #
      # All three files in one artifact. GitHub always wraps an artifact in a
      # zip -- there is no way to serve a raw file through the artifacts API --
      # so splitting them would have produced three zips rather than three
      # files, and the ISO, its checksum and the manifest that describes it
      # belong together anyway.
      #
      # `gh run download <run-id>` unpacks the zip into plain files, which is
      # the closest thing to an unzipped download that exists.
      - name: Upload the ISO
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.iso }}
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.packages.txt
          retention-days: ${{ steps.version.outputs.retention }}
          # The ISO is already zstd-compressed inside; zipping it again costs
          # minutes of CPU and saves essentially nothing.
          compression-level: 0
          # An empty artifact should fail the build, not warn and move on.
          if-no-files-found: error
