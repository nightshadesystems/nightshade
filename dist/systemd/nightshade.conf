# systemd-tmpfiles rules for the directories Nightshade owns.
#
# /run/nightshade has to exist, with the right group, before the socket unit
# creates a socket in it -- and it lives on a tmpfs, so it has to be recreated
# on every boot. tmpfiles is what does that; ProtectSystem=strict in the
# service means configd could not create it with the right ownership anyway.
#
# Installed as /usr/lib/tmpfiles.d/nightshade.conf.

# type path                        mode uid  gid              age argument

# Sessions, running state, the confirm marker and the socket. Group-readable
# so a member of nightshade-admin can see the socket to connect to it.
d /run/nightshade                  0750 root nightshade-admin -
d /run/nightshade/sessions         0700 root root             -

# The saved configuration. Not group-writable: `save` goes through configd,
# which is the only thing that should be writing it, and an operator editing
# it by hand does so as root.
d /etc/nightshade                  0755 root root             -

# The archive and the last-applied artifacts.
d /var/lib/nightshade              0750 root root             -
d /var/lib/nightshade/archive      0750 root root             -
d /var/lib/nightshade/last-applied 0700 root root             -
