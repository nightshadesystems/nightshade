# systemd-tmpfiles rules for the directories Nightshade owns.
#
# /run/nightshade has to exist, with the right group, before the socket unit
# creates a socket in it -- and it lives on a tmpfs, so it has to be recreated
# on every boot. tmpfiles is what does that; ProtectSystem=strict in the
# service means configd could not create it with the right ownership anyway.
#
# Installed as /usr/lib/tmpfiles.d/nightshade.conf.

# type path                        mode uid  gid              age argument

# Sessions, running state, the confirm marker and the socket. Group-readable
# so a member of nightshade-admin can see the socket to connect to it.
d /run/nightshade                  0750 root nightshade-admin -
d /run/nightshade/sessions         0700 root root             -

# The saved configuration. Root-only, not merely not-group-writable: since
# `system login user ... encrypted-password` exists, config.boot holds the same
# crypt hashes /etc/shadow does, and /etc/shadow is 0640 root:shadow precisely
# so that a local account cannot take one away and attack it offline. A
# world-readable copy of it in /etc would hand back exactly what that mode is
# there to withhold.
#
# Nothing unprivileged needs to read it: `ns` never opens config.boot, it asks
# configd, which is the only writer. An operator editing it by hand does so as
# root.
d /etc/nightshade                  0700 root root             -

# The archive and the last-applied artifacts.
d /var/lib/nightshade              0750 root root             -
d /var/lib/nightshade/archive      0750 root root             -
d /var/lib/nightshade/last-applied 0700 root root             -

# Where the interfaces renderer writes .network/.netdev/.link files.
#
# systemd-networkd only ever READS this directory, so on a box that has never
# had a rendered file written to it, nothing creates it -- and that is fatal
# rather than untidy: configd runs under ProtectSystem=strict, and systemd
# fails a unit outright when a ReadWritePaths= entry does not exist. The
# namespace setup fails, ExecStart never runs, Restart=on-failure burns through
# StartLimitBurst, and the unit stays dead.
#
# On an appliance whose only account has `ns` for a login shell, a configd that
# cannot start is a machine nobody can log in to. Created here, before anything
# needs it, rather than depending on networkd having had a reason to.
d /run/systemd/network             0755 root root             -
